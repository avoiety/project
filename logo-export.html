<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>MOODROBE Logo Export</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
      :root { --ink-dark:#17294c; --sun:#ffe77a; --pink:#ff9fba; }
      html, body { width:340px; height:100px; margin:0; background:transparent; }
      body { display:flex; align-items:center; padding-left:20px; box-sizing:border-box; }
      .brand { color:var(--ink-dark); font:18px "Press Start 2P", monospace; letter-spacing:-2px; text-decoration:none; text-shadow:3px 3px 0 var(--sun); }
      .brand span { color:var(--pink); }
    </style>
  </head>
  <body><span class="brand">moodrobe<span>.</span></span></body>
</html>
